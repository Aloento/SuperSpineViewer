<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect width="1180" height="470" fill="#ffffff"/>
  <text x="40" y="52" font-size="27" font-weight="700" fill="#1b1b1b">一次只需要准备 3 个文件</text>
  <text x="40" y="84" font-size="16" fill="#5b5b5b">加载一个 Spine 动画，必须同时提供下面三样东西，缺一个都不行。</text>

  <g>
    <rect x="40" y="112" width="300" height="176" rx="12" fill="#f5faff" stroke="#0f6cbd" stroke-width="2"/>
    <text x="62" y="146" font-size="19" font-weight="700" fill="#0f6cbd">① 骨架文件</text>
    <text x="62" y="176" font-size="15" fill="#1b1b1b" font-family="Consolas,monospace">goblins-mesh.json</text>
    <text x="62" y="200" font-size="15" fill="#1b1b1b" font-family="Consolas,monospace">或 goblins-mesh.skel</text>
    <text x="62" y="232" font-size="14" fill="#3b3b3b">· 动画的“动作数据”</text>
    <text x="62" y="256" font-size="14" fill="#3b3b3b">· 两种格式二选一，不用都给</text>
  </g>
  <text x="356" y="212" font-size="30" font-weight="700" fill="#0f6cbd">+</text>

  <g>
    <rect x="398" y="112" width="300" height="176" rx="12" fill="#f5faff" stroke="#0f6cbd" stroke-width="2"/>
    <text x="420" y="146" font-size="19" font-weight="700" fill="#0f6cbd">② 图集描述</text>
    <text x="420" y="176" font-size="15" fill="#1b1b1b" font-family="Consolas,monospace">goblins-mesh.atlas</text>
    <text x="420" y="212" font-size="14" fill="#3b3b3b">· 记录每块小图在大图中的位置</text>
    <text x="420" y="236" font-size="14" fill="#3b3b3b">· 必须是 .atlas 文本文件</text>
    <text x="420" y="260" font-size="14" fill="#3b3b3b">· 名字要能和骨架对得上</text>
  </g>
  <path d="M548 296 L548 322" stroke="#0f6cbd" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <g>
    <rect x="756" y="112" width="300" height="176" rx="12" fill="#f5faff" stroke="#0f6cbd" stroke-width="2"/>
    <text x="778" y="146" font-size="19" font-weight="700" fill="#0f6cbd">③ 大图图片</text>
    <text x="778" y="176" font-size="15" fill="#1b1b1b" font-family="Consolas,monospace">goblins-mesh.png</text>
    <text x="778" y="212" font-size="14" fill="#3b3b3b">· 真正的画面像素</text>
    <text x="778" y="236" font-size="14" fill="#3b3b3b">· 一个 .atlas 可能引用多张图，</text>
    <text x="784" y="258" font-size="14" fill="#3b3b3b">都要一起提供</text>
  </g>
  <path d="M620 200 L748 200" stroke="#0f6cbd" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M706 160 L748 176" stroke="#0f6cbd" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <g>
    <rect x="40" y="330" width="1016" height="72" rx="12" fill="#f4fbf4" stroke="#107c10" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="62" y="360" font-size="17" font-weight="700" fill="#107c10">最省事的做法</text>
    <text x="62" y="386" font-size="15" fill="#1b1b1b">把上面三类文件放进同一个文件夹，然后把整个文件夹拖到网页的虚线框里，程序会自动配对。</text>
  </g>

  <text x="40" y="434" font-size="14" fill="#5b5b5b">文件名不需要完全一致：骨架叫 spineboy.json、图集叫 spineboy-pma.atlas 也能自动认出来。</text>
  <text x="40" y="458" font-size="14" fill="#8a0000">不支持 Spine 2.x 导出的资源；最高支持 Spine 4.3。</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0f6cbd"/>
    </marker>
  </defs>
</svg>